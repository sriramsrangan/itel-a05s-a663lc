# /etc/callbox/audio.toml - call audio on the itel A05s (Unisoc SC9863A), from the Android lab on
# 18 November 2026. The modem sound card is "saudiolte"; its number changes between boots, so it is
# always addressed by name. Commands run without a shell; failures are logged and never stop a call.

# Loudspeaker and earpiece stay off: without the Android audio HAL the codec is never routed to them.
# These keep them off if anything else touches the codec.
mute = [
  "amixer -q -c sprdphone cset name='Speaker Function' Off",
  "amixer -q -c sprdphone cset name='Speaker1 Function' Off",
  "amixer -q -c sprdphone cset name='Earpiece Function' Off",
]

# Uplink injection: PCM MIXER Route 2 with UL MIXERGAIN 16384 mixes playback on device 1 into the
# uplink (proven by an uplink capture, PCM CAPTURE Route 1). Capture route 0 records the downlink.
before_call = [
  "amixer -q -c saudiolte cset name='PCM MIXER Route' 2",
  "amixer -q -c saudiolte cset name='UL MIXERGAIN' 16384",
  "amixer -q -c saudiolte cset name='DL MIXERGAIN' 0",
  "amixer -q -c saudiolte cset name='PCM CAPTURE Route' 0",
]
after_call = [
  "amixer -q -c saudiolte cset name='PCM MIXER Route' 0",
  "amixer -q -c saudiolte cset name='UL MIXERGAIN' 0",
]

# Playback into the uplink. The device runs at 16000 Hz whatever the file says.
playback = "aplay -q -D hw:CARD=saudiolte,DEV=1 {file}"
playback_rate = 16000
playback_channels = 1

# Capture of the downlink: raw S16_LE mono on stdout. Restarted automatically when playback ends it.
capture = "arecord -q -D hw:CARD=saudiolte,DEV=0 -f S16_LE -r 8000 -c 1 -t raw"
capture_rate = 8000

# Injection reaches the modem's uplink mixer, but no listener has yet confirmed the far end hears it
# (121 ignores in-band DTMF). The owner chose to run calls anyway and flag them as possibly silent.
uplink_verified = true
