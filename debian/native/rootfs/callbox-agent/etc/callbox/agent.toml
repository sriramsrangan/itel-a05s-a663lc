# /etc/callbox/agent.toml - call box agent settings. No secrets here: the device key is in
# /etc/callbox/device.key (mode 600), written at provisioning from Secret Manager
# (project your-gateway-project, secret callbox-device-key).

# The hm-gateway Cloud Run URL (not Firebase Hosting, which cuts requests at 60 seconds).
base_url = ""
key_file = "/etc/callbox/device.key"

# DRY RUN BY DEFAULT. Only the literal boolean true lets the phone dial a job.
live = false
# When not empty, the only numbers dialled live; others are answered dryRun.
only_numbers = []

# Limits can only be lowered here (ceilings: 120 a day, 30-second ring, 45-second call).
daily_cap = 120
ring_seconds = 30
call_seconds = 45
heartbeat_seconds = 60
poll_wait_seconds = 25

# Which answered calls are uploaded for a transcript: "off", "test" (default) or "all".
# The downlink is always analysed on the phone for DTMF; only uploads are controlled here.
transcribe = "test"

# SIM numbers, reported as simNumber with each forwarded SMS. SMS tests may only go to these.
[sim_numbers]
1 = "+919000000001"
2 = "+919000000002"

# Other settings and their defaults (uncomment to change):
# data_enabled = true
# apn = "airtelgprs.com"
# data_interface = "seth_lte0"
# lte_route_metric = 1000
# concat_timeout_seconds = 600
# ussd_charset = "IRA"            # IRA, GSM, HEX or UCS2 (set on the channel before each USSD)
# cf_consent_answer = "1"         # reply to Airtel's forwarding consent prompt
# modem_restart_command = ""      # run when AT stays silent; empty: the agent exits and restarts
# state_dir = "/var/lib/callbox"
# control_socket = "/run/callbox/control.sock"
